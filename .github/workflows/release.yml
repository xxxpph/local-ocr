name: build-release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 模型已直接入库（models/onnx/），无需联网下载

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 打发布包
        shell: pwsh
        run: python tools/make_release.py --version ${{ github.ref_name }}

      - name: 上传 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
